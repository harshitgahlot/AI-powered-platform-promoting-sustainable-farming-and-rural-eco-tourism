version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ruralconnect-db
    restart: always
    environment:
      POSTGRES_DB: ruralconnect
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ruralconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ruralconnect-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ruralconnect
      - JWT_SECRET=8a9f023d8c11e74a62bb1e89c670a442e2b3c4f5a6b7c8d9e0f1a2b3c4d5e6f7
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - STORAGE_PROVIDER=local
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: ruralconnect-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
